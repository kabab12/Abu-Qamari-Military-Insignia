name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Prepare web files
        run: |
          mkdir -p www
          rsync -a --exclude='.git' --exclude='.github' --exclude='www' --exclude='supabase.sql' --exclude='node_modules' ./ www/

      - name: Create Capacitor Android project
        env:
          CI: "true"
        run: |
          npm init -y
          npm install --no-audit --no-fund @capacitor/core @capacitor/cli @capacitor/android
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.abuqumri.marks",
            "appName": "Abu Qumri",
            "webDir": "www"
          }
          EOF
          npx cap telemetry off
          npx cap add android
          npx cap sync android

      - name: Apply logo
        run: |
          SRC=icon-512.png
          RES=android/app/src/main/res
          BG=$(convert $SRC -format '%[hex:p{8,256}]' info: | cut -c1-6)
          for d in mdpi:48:108 hdpi:72:162 xhdpi:96:216 xxhdpi:144:324 xxxhdpi:192:432; do
            IFS=: read n s f <<< "$d"
            convert $SRC -resize ${s}x${s} $RES/mipmap-$n/ic_launcher.png
            convert $SRC -resize ${s}x${s} $RES/mipmap-$n/ic_launcher_round.png
            fg=$((f*62/100))
            convert $SRC -resize ${fg}x${fg} -background none -gravity center -extent ${f}x${f} $RES/mipmap-$n/ic_launcher_foreground.png
          done
          printf '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n  <color name="ic_launcher_background">#%s</color>\n</resources>\n' "$BG" > $RES/values/ic_launcher_background.xml
          find $RES -name 'splash.png' | while read f; do
            dim=$(identify -format '%wx%h' "$f")
            w=${dim%x*}; h=${dim#*x}
            m=$(( w < h ? w : h ))
            l=$(( m * 40 / 100 ))
            convert $SRC -resize ${l}x${l} /tmp/logo.png
            convert -size $dim xc:"#$BG" /tmp/logo.png -gravity center -composite "$f"
          done

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: abu-qumri-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
