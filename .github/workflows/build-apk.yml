name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Prepare web files
        run: |
          mkdir -p www
          rsync -a --exclude='.git' --exclude='.github' --exclude='www' \
            --exclude='supabase.sql' --exclude='node_modules' ./ www/

      - name: Create Capacitor Android project
        run: |
          npm init -y
          npm install @capacitor/core
