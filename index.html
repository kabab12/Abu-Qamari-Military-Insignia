function cnLabel(s,tm){const k=cnDiff(s);if(k==null)return'';const d=cnD(s),rel=k==0?'اليوم':k==1?'غدًا':k==2?'بعد غد':k<0?'متأخر '+(-k)+' يوم':'بعد '+k+' أيام';return CND[d.getDay()]+' '+d.getDate()+'/'+(d.getMonth()+1)+(tm?' · '+tm:'')+' ('+rel+')'}
function cnName(x){const c=x.cid&&D.clients.find(z=>z.id==x.cid);return c?c.name:(x.cname||'')}

function allRepL(){const C=D.clients.slice().reverse(),tot=rd(C.reduce((a,c)=>a+pn(c.total),0)),pd=rd(C.reduce((a,c)=>a+Math.min(payAll(c.pay),pn(c.total)>0?payAll(c.pay):0),0)),L=[ST('1','أبو قمري للعلامات العسكرية'),ST('s','التقرير الشامل لكل العملاء'),'---',ST('r','التاريخ',td()),ST('r','عدد العملاء',C.length),ST('r','إجمالي المبالغ',n(tot)),ST('r','إجمالي المدفوع',n(pd)),ST('t','إجمالي المتبقي',n(rd(tot-pd))),'---',''];
 C.forEach((c,i)=>{const t=pn(c.total),p=payAll(c.pay),st=invSt(c);L.push(ST('2',(i+1)+'. '+c.name+(c.grp?' — '+c.grp:'')+' ('+st.t+')'));c.phone&&L.push(ST('r','الهاتف',c.phone));L.push(ST('r','الإجمالي',n(t)),ST('r','المدفوع',n(p)),ST('r','المتبقي',n(rd(t-p))));const it=[];if((c.names||[]).length)it.push((c.names.length)+' أسماء');const pq=(c.patches||[]).reduce((a,x)=>a+pn(x.q),0);if(pq)it.push(pq+' باتش');if(it.length)L.push('  '+it.join(' · '));L.push('')});
 if(!C.length)L.push('لا يوجد عملاء');return L}
function drvAll(){if(!D.clients.length)return toast('لا يوجد عملاء');if(drvOn()){drvAdd({k:'all'});return drvFlush(1)}WL=1;toast('جارٍ تجهيز التقرير الشامل…');pdfGo(allRepL(),'تقرير-كل-العملاء-'+td(),1)}
function drvAsk(id){if(D.drvRem===0)return;const c=D.clients.find(x=>x.id==id);if(!c)return;sheet(`<b>☁️ احفظ تقرير «${esc(c.name)}» في Drive</b><div class="mu" style="margin:6px 0">تم حفظ العميل. اضغط الزر ثم اختر Drive من القائمة.</div><button class="save" onclick="cl();drvSave('${id}')">☁️ حفظ PDF هذا العميل في Drive</button><button class="o" onclick="cl();drvAll()">📚 حفظ التقرير الشامل لكل العملاء</button><button class="o" onclick="cl()">لاحقاً</button><button class="o mu" onclick="cl();D.drvRem=0;sv();toast('أُوقف التذكير (من الإعدادات يمكنك تشغيله)')">لا تذكّرني</button>`)}

// ===== الرفع التلقائي إلى Google Drive =====
const GCID='704294046263-iqa99e3fia3u2013nv198gij0t64up2o.apps.googleusercontent.com',GSC='https://www.googleapis.com/auth/drive.file',GFN='أبو قمري - التقارير';
const lsG=(k,d)=>{try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},lsS=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let GTC=null,GBUSY=0;
const drvOn=()=>lsG('abq_drv',0)==1,drvQ=()=>lsG('abq_dq',[]),drvTok=()=>{const t=lsG('abq_drvtok',null);return t&&t.exp>Date.now()+60000?t.t:null};
function drvLoad(cb){if(window.google&&google.accounts&&google.accounts.oauth2)return cb(1);if(drvLoad.l){drvLoad.q.push(cb);return}drvLoad.l=1;drvLoad.q=[cb];const s=document.createElement('script');s.src='https://accounts.google.com/gsi/client';s.onload=()=>drvLoad.q.splice(0).forEach(f=>f(1));s.onerror=()=>{drvLoad.l=0;drvLoad.q.splice(0).forEach(f=>f(0))};document.head.appendChild(s)}
function drvAuth(gesture,cb){const t=drvTok();if(t)return cb(t);if(!gesture||!navigator.onLine)return cb(null);
 drvLoad(ok=>{if(!ok)return cb(null);try{GTC=google.accounts.oauth2.initTokenClient({client_id:GCID,scope:GSC,callback:r=>{if(r&&r.access_token){lsS('abq_drvtok',{t:r.access_token,exp:Date.now()+(+r.expires_in||3600)*1000});lsS('abq_drv',1);cb(r.access_token)}else cb(null)},error_callback:()=>cb(null)});GTC.requestAccessToken({prompt:lsG('abq_drv',0)==1?'':'consent'})}catch(e){cb(null)}})}
async function drvApi(tok,url,opt){const r=await fetch(url,Object.assign({},opt,{headers:Object.assign({Authorization:'Bearer '+tok},(opt&&opt.headers)||{})}));if(r.status==401){lsS('abq_drvtok',null);throw new Error('auth')}if(!r.ok)throw new Error('http '+r.status);return r.json()}
async function drvFolder(tok){const m=lsG('abq_drvmap',{folder:null,files:{}});if(m.folder)return m.folder;const q=encodeURIComponent("mimeType='application/vnd.google-apps.folder' and name='"+GFN+"' and trashed=false"),j=await drvApi(tok,'https://www.googleapis.com/drive/v3/files?fields=files(id)&q='+q);let id=j.files&&j.files[0]&&j.files[0].id;if(!id){id=(await drvApi(tok,'https://www.googleapis.com/drive/v3/files?fields=id',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:GFN,mimeType:'application/vnd.google-apps.folder'})})).id}m.folder=id;lsS('abq_drvmap',m);return id}
async function drvUp(tok,key,name,blob){const m=lsG('abq_drvmap',{folder:null,files:{}}),old=m.files[key],B='abqB'+Date.now();const mk=meta=>new Blob(['--'+B+'\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n'+JSON.stringify(meta)+'\r\n--'+B+'\r\nContent-Type: application/pdf\r\n\r\n',blob,'\r\n--'+B+'--'],{type:'multipart/related; boundary='+B});
 if(old){try{await drvApi(tok,'https://www.googleapis.com/upload/drive/v3/files/'+old+'?uploadType=multipart&fields=id',{method:'PATCH',headers:{'Content-Type':'multipart/related; boundary='+B},body:mk({name})});return old}catch(e){if(String(e.message)=='auth')throw e}}
 const folder=await drvFolder(tok),r=await drvApi(tok,'https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id',{method:'POST',headers:{'Content-Type':'multipart/related; boundary='+B},body:mk({name,parents:[folder]})});const m2=lsG('abq_drvmap',{folder,files:{}});m2.files=m2.files||{};m2.files[key]=r.id;m2.folder=folder;lsS('abq_drvmap',m2);return r.id}
function drvPdf(job,cb){if(job.k=='all'){WL=1;if(!D.clients.length)return cb(null);return pages(allRepL(),P=>cb(mkPdf(P),'تقرير-كل-العملاء.pdf','all'))}
 const c=D.clients.find(x=>x.id==job.id),o=c&&ivCli(job.id);if(!o)return cb(null);ivRender(o,png=>img2pdf(png,b=>cb(b,('تقرير-'+c.name+'-'+o.serial).replace(/[\\\/:*?"<>|\s]+/g,'_')+'.pdf','c:'+job.id)))}
function drvAdd(j){const q=drvQ().filter(x=>!(x.k==j.k&&x.id==j.id));q.push(j);lsS('abq_dq',q)}
function drvFlush(gesture){if(!drvOn()&&!gesture)return;const q=drvQ();if(!q.length||GBUSY)return;
 drvAuth(gesture,async tok=>{if(!tok){drvPend();return}GBUSY=1;let done=0,err='';try{for(const j of q){await new Promise(res=>drvPdf(j,async(b,name,key)=>{try{if(!b){lsS('abq_dq',drvQ().filter(x=>!(x.k==j.k&&x.id==j.id)));return res()}await drvUp(tok,key,name,b);lsS('abq_dq',drvQ().filter(x=>!(x.k==j.k&&x.id==j.id)));done++}catch(e){err=e.message||'خطأ'}res()}));if(err)break}}finally{GBUSY=0}
  if(done&&!err)toast('☁️ تم الرفع إلى Drive ('+done+')');else if(err&&err!='auth')toast('تعذّر الرفع إلى Drive، سيُعاد لاحقاً');drvPend()})}
function drvPend(){try{if($('#app')&&(location.hash.slice(1)||'home')=='home'||location.hash=='#set')render(1)}catch(e){}}
